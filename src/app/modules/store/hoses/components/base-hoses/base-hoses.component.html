<div class="submit_box d-flex justify-content-between align-items-center">
  <div class="box-radio">
    <h5>{{ id ? 'ویرایش شلنگ' : 'ثبت شلنگ جدید' }}</h5>
  </div>
  <app-mehr-button class="btn-grid" (onClick)="onBack()">بازگشت</app-mehr-button>
</div>
<form [formGroup]="formGroup">
  <div class="row form-container p-1 pt-3 pb-3">
    <div class="col-md-3">
      <app-mehr-input
        [label]="'کد انبار'"
        formControlName="code"
        [required]="true"
        [placeholder]="'کد منحصر به فرد'">
      </app-mehr-input>
    </div>
    <div class="col-md-3">
      <app-mehr-select
        [label]="'برند'"
        formControlName="brand"
        [items]="brandDrop"
        [bindValue]="'id'"
        [bindTitle]="'name'"
        [emptyOption]="true"
        [required]="true">
      </app-mehr-select>
    </div>
    <div class="col-md-3">
      <app-mehr-select
        [label]="'سایز (اینچ)'"
        formControlName="sizeInch"
        [items]="sizeDrop"
        [bindValue]="'id'"
        [bindTitle]="'name'"
        [emptyOption]="true"
        [required]="true">
      </app-mehr-select>
    </div>
    <div class="col-md-3">
      <app-mehr-select
        [label]="'استاندارد (لایه سیم)'"
        formControlName="standard"
        [items]="standardDrop"
        [bindValue]="'id'"
        [bindTitle]="'name'"
        [emptyOption]="true"
        [required]="true">
      </app-mehr-select>
    </div>
    <div class="col-md-3">
      <app-mehr-input
        [label]="'متراژ موجودی'"
        formControlName="metersInStock"
        numbersOnly
        [required]="true"
        [inputType]="'number'"
        [placeholder]="'متراژ به متر'">
      </app-mehr-input>
    </div>
    <div class="col-md-3">
      <app-mehr-amount-input
        [label]="'قیمت خرید (متری)'"
        formControlName="entryPricePerMeter"
        [mask]="'separator.2'"
        [separator]="','"
        [required]="true"
        [placeholder]="'قیمت به ریال'">
      </app-mehr-amount-input>
    </div>
    <div class="col-md-3">
      <app-mehr-select
        [label]="'کاربرد'"
        formControlName="application"
        [items]="applicationDrop"
        [bindValue]="'id'"
        [bindTitle]="'name'"
        [emptyOption]="true">
      </app-mehr-select>
    </div>
    <div class="col-md-3">
      <app-mehr-input
        [label]="'شماره قفسه'"
        formControlName="shelf"
        numbersOnly
        [required]="true"
        [inputType]="'number'"
        [placeholder]="'مثال: ۱'">
      </app-mehr-input>
    </div>
    <div class="col-md-3">
      <app-mehr-input
        [label]="'ردیف'"
        formControlName="row"
        numbersOnly
        [required]="true"
        [inputType]="'number'"
        [placeholder]="'مثال: ۲'">
      </app-mehr-input>
    </div>
    <div class="col-md-3">
      <app-mehr-input
        [label]="'ستون'"
        formControlName="column"
        numbersOnly
        [required]="true"
        [inputType]="'number'"
        [placeholder]="'مثال: ۳'">
      </app-mehr-input>
    </div>
    <div class="col-md-3">
      <app-mehr-input
        [label]="'توضیحات'"
        formControlName="description"
        [placeholder]="'توضیحات اضافی...'">
      </app-mehr-input>
    </div>
    <div class="col-md-3"></div>
    <div class="col-md-12 mt-3 d-flex justify-content-end">
      <app-mehr-button
        bgColor="success"
        [disabled]="formGroup.invalid"
        (onClick)="onSave()">
        {{ id ? 'ثبت تغییرات' : 'ذخیره' }}
      </app-mehr-button>
    </div>
  </div>
</form>
